[project]
name = "card-dispute-agent"
version = "0.1.0"
description = "Transparent agentic card-dispute investigation proof of concept"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "deepagents>=0.5.3,<0.6",
  "langchain>=1.0",
  "langchain-openai>=1.0",
  "langgraph>=1.0",
  "langgraph-checkpoint-sqlite>=3.0",
  "openai>=2.0",
  "pydantic>=2.10",
  "pyyaml>=6.0",
  "sqlite-vec>=0.1.6",
  "typer>=0.15",
]

[project.optional-dependencies]
graph = ["ladybug>=0.20,<0.21"]
api = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "sse-starlette>=2.1",
]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.25",
  "ruff>=0.9",
  "httpx>=0.27",
]

[project.scripts]
inspect = "cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["src"]
sources = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
