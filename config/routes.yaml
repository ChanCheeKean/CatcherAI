    priority: 10
    match:
      claim_family_initial: fraud_card_present
      descriptor_history_count_min: 1
    output:
      depth: L1
      graph_path: clarification_fast_path
      agents: [lead_investigator]
      skills: [eligibility-check]
      budget:
        tool_calls: 7
        model_input_tokens: 30000
        model_output_tokens: 4000
        wall_seconds: 60
        replans: 0
        no_progress_iterations: 1

