schema_version: 1
provider: openai
api: responses
default:
  model: gpt-5.6-luna
  reasoning_effort: medium
  timeout_seconds: 60
  max_attempts: 3
  max_output_tokens: 12000
  required_capabilities:
    - structured_output
    - tool_calling
    - streaming
    - reasoning_controls
    - usage_reporting
    - prompt_caching
role_overrides: {}
concurrency:
  model_calls: 8
  per_run: 4
retry:
  initial_backoff_ms: 500
  max_backoff_ms: 8000

