# Resolved-case write-ups on analogous facts; never the showcase cases themselves.
- title: Facilitator prefix hid a familiar coffee shop
  body: Cardholder disputed a charge whose descriptor began with a payment-facilitator prefix and a store
    number. The terminal behind the descriptor was operated by a merchant the cardholder had bought from
    weekly; the same card and location appeared on earlier undisputed purchases. Resolved as valid purchase,
    dispute withdrawn after the merchant identity was shown.
- title: Two clearings of one purchase were a split, not a duplicate
  body: Two same-day charges of matching size looked like a duplicate. The authorization records showed
    one authorization covering a partial and a completion clearing whose sum equalled the order total.
    One charge was credited only where the sum exceeded the order.
- title: Only the refunded part of an order was credited
  body: A merchant credit arrived without a reference to the original charge. It was matched to the purchase
    order and covered part of the amount; only the remainder was disputed and accepted.
- title: Cardholder-favourable resolution when the merchant never answered
  body: The merchant ignored the evidence request until the deadline. With nothing on file proving delivery
    or service, the claim was resolved in the cardholder's favour and the silence recorded as the reason.
- title: Card-present skimming traced to a single fuel pump
  body: Several unrelated cardholders reported counterfeit use after fuel purchases. Their only shared
    prior touchpoint was one terminal within the same two-week window. Later fraud was attributed to that
    compromise point, and other terminals at the merchant were cleared.
- title: Shared merchant alone did not prove a compromise
  body: Three fraud claims at a popular retailer looked linked, but the cardholders had visited a hundred
    other merchants in common and no terminal was shared. No compromise point was declared; each claim
    was decided on its own facts.
- title: Household tablet purchase by an authorized user
  body: A parent disputed in-app purchases. The device was registered to the household, an authorized
    user on the account had used it for months and the delivery address matched the home. Resolved as
    authorized use; the parent was told how to add parental controls.
- title: Roommates on one street were not one household
  body: Two customers shared a street name and building but different units, devices and phones. Fraud
    links between them were coincidental; the claims were assessed separately.
- title: Account takeover revealed by a shared drop address
  body: Dozens of accounts changed contact details, added a new device and shipped high-value goods to
    one address within days. The address, newly issued tokens and a common device were the link; every
    affected account was credited and secured, and the address was flagged.
- title: Password reset followed by device change is an ATO signal
  body: A cardholder denied purchases that followed an email change, a password reset and a login from
    a device never seen before. The temporal order of these edge events outweighed the correct card credentials
    used at checkout.
- title: Corporate office IP is not evidence of shared identity
  body: Five customers logged in from the same IP. It belonged to an office range and the customers were
    colleagues with independent devices and purchase histories. The IP was discarded as a link.
- title: Carrier-grade NAT address shared by unrelated customers
  body: Dozens of unrelated accounts appeared behind one IP for a few hours. The address block was carrier-grade
    NAT; the overlap alone was not treated as fraud.
- title: Recycled phone number did not tie two customers
  body: Two customers had the same phone number in different periods. The validity windows did not overlap,
    so the earlier owner's history did not attach to the later one.
- title: 'Porch-pirate claim rejected: delivery address matched the cardholder''s home'
  body: Package marked delivered and signed at the cardholder's own address, with no other claims nearby.
    The claim was declined with a description of the evidence.
- title: Coordinated not-received claims delivered to a common drop point
  body: Several cardholders claimed non-delivery for parcels shipped to nearby addresses with the same
    recipient alias and a shared reshipper account. The pattern showed a claims ring; claims were declined
    and the accounts reviewed.
- title: 'Delivered to the wrong house: carrier confirmed a different address'
  body: The carrier scan showed delivery to an address that differed from the order's ship-to, and the
    merchant did not respond. Resolved in the cardholder's favour.
- title: AI agent exceeded the spending mandate
  body: A cardholder delegated shopping to an assistant with a monthly limit. The agent's purchase exceeded
    the mandate's per-transaction cap. The portion above the mandate was treated as unauthorized; the
    portion within it was authorized.
- title: Agent purchase inside mandate is authorized even if unexpected
  body: The cardholder was surprised by an agent-made booking, but the mandate covered the merchant category,
    the amount and the date. The dispute was declined.
- title: Tokenised wallet transaction traced to provisioning by a third party
  body: The disputed payments used a token provisioned on a device never used by the cardholder, after
    a support-line contact. The token, not the card number, identified the compromise.
- title: Merchant reputation note was stale after acquirer change
  body: A remembered note called a merchant high-risk. The merchant had since moved to a new acquirer
    and cleared its backlog; the note was superseded and not used against the cardholder.
- title: Memory note contradicted by fresh evidence was retracted
  body: An earlier note claimed a device belonged to a fraud ring. Current graph facts showed a household
    tablet with authorised users; the note was retracted with a citation.
- title: 'Reg E clock: provisional credit due despite open investigation'
  body: A debit cardholder reported unauthorised transfers. The investigation was still open at the deadline,
    so provisional credit was posted on time and reversed only after findings and notice.
- title: 'Reg Z: billing error notice inside 60 days protected the cardholder'
  body: The cardholder disputed a credit-card charge within sixty days of the statement. Payment of the
    disputed amount was suspended pending the investigation.
- title: Liability tier applied only for lost or stolen access device
  body: A debit claim involved credentials rather than a lost card. The two-tier liability cap for lost
    devices did not apply; the general sixty-day statement rule governed.
- title: Subscription cancelled before renewal, merchant recurred anyway
  body: The cardholder produced a cancellation confirmation dated before the renewal. The recurring charge
    was credited and the merchant's continued billing recorded.
- title: Free trial converted with disclosed terms
  body: Order records showed the trial terms, an email reminder and a login after conversion. The claim
    was declined as the cardholder had consented and used the service.
- title: Hotel no-show fee upheld on folio evidence
  body: The folio and reservation showed a guaranteed booking cancelled after the policy window. The fee
    was valid; the remainder of the stay charge was credited.
- title: Currency conversion difference is not a billing error
  body: Cardholder disputed the difference between merchant currency and billed amount. The network rate
    and disclosed foreign transaction fee explained it fully.
- title: 'Compelling evidence: prior undisputed transactions on the same device'
  body: Two prior undisputed purchases from the same device and address were considered strong evidence
    of cardholder involvement. The card-absent fraud claim was declined.
- title: Duplicate dispute of the same transaction avoided
  body: A second complaint about an already-disputed charge was linked to the open case instead of starting
    a second cycle, as the network rules forbid re-disputing one transaction twice.
